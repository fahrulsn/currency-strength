<!-- public/index.html -->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Currency Strength (EMA200)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding: 24px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }
      table {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3 class="mb-3">Currency Strength (Close vs EMA200)</h3>

      <form id="cfg" class="row g-2 align-items-end">
        <div class="col-md-2">
          <label class="form-label">Interval</label>
          <select class="form-select" id="interval">
            <option value="1h" selected>1h</option>
            <option value="4h">4h</option>
            <option value="1day">D1</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Outputsize</label>
          <input
            type="number"
            id="outputsize"
            class="form-control"
            value="260"
            min="200"
            max="1000"
          />
        </div>
        <div class="col-md-3">
          <label class="form-label">API Key (TwelveData)</label>
          <input
            type="password"
            id="apikey"
            class="form-control"
            placeholder="isi kalau tidak set di env"
          />
        </div>
        <div class="col-md-2">
          <label class="form-label">USD DXY Boost</label>
          <input
            type="number"
            step="0.1"
            id="usdBoost"
            class="form-control"
            value="2"
          />
        </div>
        <div class="col-md-3">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="useConfluence"
              checked
            />
            <label class="form-check-label" for="useConfluence"
              >Confluence EMA50 &gt; EMA200</label
            >
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="fullMode" />
            <label class="form-check-label" for="fullMode"
              >Proses semua pair (patuh rate limit)</label
            >
          </div>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" id="run">Hitung</button>
        </div>
      </form>

      <hr class="my-4" />

      <div id="meta" class="alert alert-secondary small d-none"></div>

      <h5>Ranking (Normalized 0–100)</h5>
      <div class="table-responsive">
        <table class="table table-sm table-striped" id="tbl-norm">
          <thead>
            <tr>
              <th>#</th>
              <th>Currency</th>
              <th>Score</th>
              <th>Strength</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <h5 class="mt-4">Best Signal Pair</h5>
      <div class="row">
        <div class="col-md-6">
          <div class="table-responsive">
            <table class="table table-sm table-bordered" id="tbl-hot-buy">
              <thead>
                <tr>
                  <th style="width: 48px">#</th>
                  <th>Pair</th>
                  <th>Signal</th>
                  <th>Δ Strength</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="col-md-6">
          <div class="table-responsive">
            <table class="table table-sm table-bordered" id="tbl-hot-sell">
              <thead>
                <tr>
                  <th style="width: 48px">#</th>
                  <th>Pair</th>
                  <th>Signal</th>
                  <th>Δ Strength</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <h5 class="mt-4">Detail Per Pair</h5>
      <div class="table-responsive">
        <table class="table table-sm table-hover" id="tbl-pairs">
          <thead>
            <tr>
              <th>Pair</th>
              <th>Base</th>
              <th>Quote</th>
              <th>Close</th>
              <th>EMA50</th>
              <th>EMA200</th>
              <th>Signal</th>
              <th>Weight</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <h6 class="mt-3" id="dxy"></h6>

      <details class="mt-3">
        <summary>Log</summary>
        <div id="log" class="mono"></div>
      </details>
    </div>

    <script>
      const fmt = (n, d = 5) => (typeof n === "number" ? n.toFixed(d) : n);

      document.getElementById("run").addEventListener("click", async (e) => {
        e.preventDefault();
        const params = new URLSearchParams({
          interval: document.getElementById("interval").value,
          outputsize: document.getElementById("outputsize").value,
          useConfluence: document.getElementById("useConfluence").checked
            ? "1"
            : "0",
          fast: document.getElementById("fullMode").checked ? "0" : "1",
          all: document.getElementById("fullMode").checked ? "1" : "0",
          usdBoost: document.getElementById("usdBoost").value,
        });
        const apikey = document.getElementById("apikey").value.trim();
        if (apikey) params.set("apikey", apikey);

        const btn = e.target;
        btn.disabled = true;
        btn.textContent = "Processing...";
        try {
          const res = await fetch(`/api/strength?${params.toString()}`);
          const data = await res.json();

          const meta = document.getElementById("meta");
          meta.classList.remove("d-none");
          meta.textContent = `Mode: ${data.meta.mode} | Pairs: ${data.meta.pairs_count} | Interval: ${data.meta.interval} | Outputsize: ${data.meta.outputsize} | Confluence: ${data.meta.useEMA50Confluence}`;

          // Ranking normalized
          const tn = document.querySelector("#tbl-norm tbody");
          tn.innerHTML = "";
          data.rank_norm.forEach((r, i) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${i + 1}</td><td>${r.Currency}</td><td>${fmt(
              r.Score,
              3
            )}</td><td>${fmt(r.Strength, 1)}</td>`;
            tn.appendChild(tr);
          });
          const hot = buildHotPairs(data.rank_norm, 3, 3, 3);
          renderHotTables(hot);
          // Detail pairs
          const tp = document.querySelector("#tbl-pairs tbody");
          tp.innerHTML = "";
          data.pairs_detail.forEach((p) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${p.Pair}</td><td>${p.Base}</td><td>${
              p.Quote
            }</td>
                            <td>${fmt(p.Close)}</td><td>${fmt(
              p.EMA50
            )}</td><td>${fmt(p.EMA200)}</td>
                            <td>${p.Signal}</td><td>${fmt(p.Weight, 3)}</td>`;
            tp.appendChild(tr);
          });

          document.getElementById("dxy").textContent = data.dxy_info;
          document.getElementById("log").textContent = (data.logs || []).join(
            "\n"
          );
        } catch (err) {
          alert("Error: " + err);
        } finally {
          btn.disabled = false;
          btn.textContent = "Hitung";
        }
      });
      function buildHotPairs(rankNorm, topN = 3, botN = 3, maxRows = 3) {
        if (!rankNorm || rankNorm.length < 2) return { buy: [], sell: [] };

        // sudah urut Strength descending
        const tops = rankNorm.slice(0, Math.min(topN, rankNorm.length));
        const bottoms = rankNorm.slice(Math.max(rankNorm.length - botN, 0));

        const candidates = [];

        // buat kombinasi silang semua top vs bottom
        for (const t of tops) {
          for (const b of bottoms) {
            const st = Number(t["Strength"] ?? 0);
            const sb = Number(b["Strength"] ?? 0);
            const gap = st - sb;
            const pairBuy = `${t.Currency}/${b.Currency}`;
            const pairSell = `${b.Currency}/${t.Currency}`;
            candidates.push({
              pairBuy,
              pairSell,
              gap,
              top: t.Currency,
              bottom: b.Currency,
            });
          }
        }

        // urut berdasarkan gap terbesar
        candidates.sort((a, b) => b.gap - a.gap);

        // ambil 3 BUY dan 3 SELL teratas
        const topBuy = candidates.slice(0, maxRows).map((c, i) => ({
          no: i + 1,
          pair: c.pairBuy,
          base: c.top,
          quote: c.bottom,
          signal: "BUY",
          gap: c.gap,
        }));
        const topSell = candidates.slice(0, maxRows).map((c, i) => ({
          no: i + 1,
          pair: c.pairSell,
          base: c.bottom,
          quote: c.top,
          signal: "SELL",
          gap: c.gap,
        }));

        return { buy: topBuy, sell: topSell };
      }

      function renderHotTables(hot) {
        const tb = document.querySelector("#tbl-hot-buy tbody");
        const ts = document.querySelector("#tbl-hot-sell tbody");
        tb.innerHTML = "";
        ts.innerHTML = "";

        hot.buy.forEach((r) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${r.no}</td>
            <td>${r.pair}</td>
            <td><span class="badge bg-success">${r.signal}</span></td>
            <td>${fmt(r.gap, 1)}</td>`;
          tb.appendChild(tr);
        });

        hot.sell.forEach((r) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${r.no}</td>
            <td>${r.pair}</td>
            <td><span class="badge bg-danger">${r.signal}</span></td>
            <td>${fmt(r.gap, 1)}</td>`;
          ts.appendChild(tr);
        });
      }
    </script>
  </body>
</html>
